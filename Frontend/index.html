<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager — Manage Your Tasks</title>
    <meta
      name="description"
      content="A beautiful task manager to organize, prioritize, and track your tasks efficiently."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Background Effects -->
    <div class="bg-effects">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <div class="app-container">
      <!-- Header -->
      <header class="header">
        <h1>ToDo Manager</h1>
        <p>Organize, prioritize, and track all your tasks in one place</p>
      </header>

      <!-- Stats Bar -->
      <div class="stats-bar">
        <div class="stat-card total">
          <div class="stat-label">Total Tasks</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card pending">
          <div class="stat-label">Pending</div>
          <div class="stat-value" id="stat-pending">0</div>
        </div>
        <div class="stat-card progress">
          <div class="stat-label">In Progress</div>
          <div class="stat-value" id="stat-progress">0</div>
        </div>
        <div class="stat-card done">
          <div class="stat-label">Completed</div>
          <div class="stat-value" id="stat-done">0</div>
        </div>
      </div>

      <!-- Action Bar -->
      <div class="action-bar">
        <button class="btn-add" id="btn-add-task" onclick="openCreateModal()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 4.5v15m7.5-7.5h-15"
            />
          </svg>
          Add Task
        </button>
        <div class="filter-group">
          <button class="filter-btn active" onclick="filterTasks('all', this)">
            All
          </button>
          <button class="filter-btn" onclick="filterTasks('pending', this)">
            Pending
          </button>
          <button class="filter-btn" onclick="filterTasks('in_progress', this)">
            In Progress
          </button>
          <button class="filter-btn" onclick="filterTasks('done', this)">
            Done
          </button>
        </div>
        <div class="search-box">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
            />
          </svg>
          <input
            type="text"
            id="search-input"
            placeholder="Search tasks..."
            oninput="searchTasks(this.value)"
          />
        </div>
      </div>

      <!-- Task List -->
      <div class="task-list" id="task-list">
        <div class="loading-spinner">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <!-- Add Task Modal -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modal-title">✨ Create New Task</h2>
          <button class="btn-close" onclick="closeModal()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              width="18"
              height="18"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18 18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <form id="task-form" onsubmit="handleFormSubmit(event)">
          <input type="hidden" id="edit-task-id" />
          <div class="form-group">
            <label for="task-title">Task Title</label>
            <input
              type="text"
              id="task-title"
              placeholder="e.g. Design homepage UI"
              required
            />
          </div>
          <div class="form-group">
            <label for="task-desc">Description</label>
            <textarea
              id="task-desc"
              placeholder="Describe your task in detail..."
              required
            ></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="task-priority">Priority</label>
              <select id="task-priority" required>
                <option value="low">🟢 Low</option>
                <option value="medium" selected>🟡 Medium</option>
                <option value="high">🔴 High</option>
              </select>
            </div>
            <div class="form-group">
              <label for="task-status">Status</label>
              <select id="task-status" required>
                <option value="pending" selected>⏳ Pending</option>
                <option value="in_progress">🔄 In Progress</option>
                <option value="done">✅ Done</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn-submit" id="btn-submit">
            Create Task
          </button>
        </form>
      </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- JavaScript -->
    <script src="app.js"></script>
  </body>
</html>
